name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: teamadvert
          POSTGRES_PASSWORD: teamadvert
          POSTGRES_DB: teamadvert
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U teamadvert -d teamadvert"
          --health-interval=5s
          --health-retries=20
    env:
      TEST_DATABASE_URL: postgres://teamadvert:teamadvert@127.0.0.1:5433/teamadvert_test
      PGPASSWORD: teamadvert
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: psql -h 127.0.0.1 -p 5433 -U teamadvert -d teamadvert -f tools/db-init/01-test-db.sql
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
